<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>單頁展示轉換工具</title>
<style>
:root{font:15px/1.5 system-ui,sans-serif;color:#231f20;background:#f6f5f2}*{box-sizing:border-box}
body{margin:0}header{padding:24px max(24px,4vw);background:#242321;color:white}h1{font-size:24px;margin:0}
.app-header{display:flex;align-items:center;flex-wrap:wrap;justify-content:space-between;gap:8px 12px}
.app-controls{display:flex;align-items:center;gap:4px;margin-inline-start:auto}
.app-controls .header-action{display:inline-flex;align-items:center;gap:6px;justify-content:center;min-height:44px;padding:0 10px;border:0;border-radius:4px;background:transparent;color:white;font:inherit;white-space:nowrap;text-decoration:none;cursor:pointer}
.app-controls .header-action svg{width:18px;height:18px}
#import-toggle{position:relative;margin-inline-end:8px}
#import-toggle::after{content:'';position:absolute;inset-inline-end:-6px;inset-block:13px;width:1px;background:#686259;pointer-events:none}
.app-controls .header-action[aria-disabled=true]{opacity:.4;cursor:default}
.app-controls .header-action:not([aria-disabled=true]):is(:hover,:focus-visible){background:#46423e}
.app-controls .header-action:focus-visible{outline:2px solid white;outline-offset:2px}
.app-controls [role=tooltip]{border:1px solid #686259}
@media(max-width:460px){
  .app-header{padding:16px max(16px,4vw)}
  .app-header h1{font-size:18px}
  .app-controls{gap:2px}
  #import-toggle{margin-inline-end:6px}
  #import-toggle::after{inset-inline-end:-5px}
  .app-controls .header-action{padding-inline:6px;gap:4px}
  .app-controls .header-action svg{width:16px;height:16px}
}
main{padding:24px max(16px,4vw)}h2{font-size:18px;margin:0 0 10px}p{margin:0 0 12px}
form,.panel{background:white;padding:20px;border:1px solid #d9d5ce;margin-bottom:16px;max-width:100%}
.toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:12px 20px}
.import-panel{max-width:540px;margin:0 auto 16px;padding:clamp(32px,5vw,40px) clamp(24px,5vw,40px);text-align:center}
.import-panel > h2{margin-bottom:28px}
#import{margin:0;padding:0;border:0}
#import [hidden]{display:none!important}
.import-inputs,.import-sources,.import-options{display:grid;grid-template-columns:minmax(0,1fr)}
.import-inputs{gap:12px}
.import-sources{gap:20px}
.import-modes{margin:0;padding:0;border:0;min-width:0}
.import-modes .control-toggle,.parse-button{width:min(100%,312px);margin-inline:auto}
.import-modes .control-toggle{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.import-modes label{position:relative;display:grid;place-items:center;min-height:44px;padding:6px 2px;border:1px solid #b6b0a7;cursor:pointer}
.import-modes label + label{border-inline-start:0}
.import-modes input{position:absolute;opacity:0}
.import-modes label:has(:checked){z-index:1;background:#242321;border-color:#242321;color:white}
.import-modes label:has(:focus-visible){z-index:2;outline:2px solid #395d75;outline-offset:2px}
.import-source{display:grid;justify-items:center;min-width:0;gap:8px}
.import-source small{font-size:13px;color:#504d47}
.file-picker{position:relative;display:inline-grid;place-items:center;min-height:44px;padding:6px 16px;border-radius:8px;background:#efede8}
.file-picker:has(input:hover:not(:disabled)){background:#e3dfd7}
.file-picker:has(input:focus-visible){outline:2px solid #395d75;outline-offset:2px}
.file-picker:has(input:disabled){opacity:.4}
.file-picker input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.file-choice{display:flex;justify-content:center;align-items:center;gap:6px;min-width:0;max-width:100%;color:#504d47}
.file-choice span{min-width:0;overflow-wrap:anywhere}
.file-choice button{flex:none;padding-inline:8px;min-height:44px;border-color:transparent;background:transparent}
.file-choice button:is(:hover,:focus-visible){background:#f0ede8}
.import-review{margin-top:20px;padding-top:16px;border-top:1px solid #e7e2dc}
.import-options{gap:14px;justify-items:center}
.import-options label:has(#fetch-images){display:flex;align-items:center;gap:6px}
#fetch-images{margin:0}
.import-archive{margin:0;min-width:0}
.import-archive summary{cursor:pointer}
.import-archive .import-source{margin-top:6px}
.import-archive[open] #archive-selection{display:none}
#archive-selection:not(:empty){margin-inline-start:6px;color:#504d47;overflow-wrap:anywhere}
.import-actions{margin-top:18px}
.parse-button{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px}
.parse-button svg{width:18px;height:18px}
.parse-button:disabled{background:#e7e2dc;border-color:#d9d5ce;color:#5c5650;opacity:1;cursor:default}
#import[aria-busy=true] .parse-button:disabled{cursor:wait}
.import-progress{width:min(100%,312px);margin:14px auto 0;color:#504d47;font-size:13px}
.import-progress-label{display:flex;justify-content:space-between;gap:8px;margin:0 0 6px;text-align:start}
#import-percentage{font-variant-numeric:tabular-nums}
#import-progress{display:block;width:100%;height:8px;border:0;border-radius:4px;appearance:none;background:#e7e2dc;accent-color:#395d75}
#import-progress::-webkit-progress-bar{background:#e7e2dc;border-radius:4px}
#import-progress::-webkit-progress-value{background:#395d75;border-radius:4px}
#import-progress::-moz-progress-bar{background:#395d75;border-radius:4px}
input[type=file]{max-width:100%;font:inherit}
button{font:inherit;padding:8px 14px;border:1px solid #b6b0a7;background:white;color:#242321;cursor:pointer}
button.primary{background:#242321;color:white;border-color:#242321}button:disabled{opacity:.65;cursor:wait}
#status{margin:12px 0 0;overflow-wrap:anywhere}#status:empty{display:none}
.preview{padding:12px;background:#eae7e1;overflow:auto}
.preview-stage{position:relative;width:min(100%,var(--preview-width));height:calc(68vh * var(--preview-scale,1));margin-inline:auto;overflow:clip}
.preview[data-width-mode=manual] .preview-stage{width:var(--preview-width)}
#page{position:absolute;inset:0 auto auto 0;width:var(--preview-width);height:68vh;border:0;background:white;transform-origin:top left;transform:scale(var(--preview-scale,1))}
.workspace-controls{display:grid;gap:12px;align-items:start;margin-bottom:12px}
.workspace-controls > .panel{margin:0;padding:16px;min-width:0}
.workspace-controls #summary{margin-bottom:6px}
.workspace-controls #missing{margin:6px 0 0}
.workspace-controls #image-downloads:empty{display:none}
.workspace-controls summary{cursor:pointer}
@media(min-width:1040px){
  .workspace-controls{grid-template-columns:minmax(270px,.52fr) minmax(0,1.48fr);align-items:stretch}
}
.logo-panel [hidden]{display:none!important}
.display-header{margin-bottom:10px}
.display-header h2{margin:0}
.action-tip{position:relative;display:inline-flex}
.icon-action{display:grid;place-items:center;width:44px;height:44px;padding:0;border:0;border-radius:4px;background:transparent;color:#242321;cursor:pointer}
.icon-action:is(:hover,:focus-visible){background:#f0ede8}
.icon-action:active:not([aria-disabled=true]){background:#e7e2dc}
.icon-action svg{width:20px;height:20px}
.icon-action[aria-disabled=true]{color:#77716b;cursor:default}
.action-tip [role=tooltip]{position:absolute;z-index:3;inset-block-start:calc(100% + 4px);inset-inline-end:0;width:max-content;max-width:calc(100vw - 52px);padding:5px 8px;background:#242321;color:white;font-size:13px;visibility:hidden;pointer-events:none}
.action-tip:hover [role=tooltip],.action-tip:has(:focus-visible) [role=tooltip]{visibility:visible}
.toolbar{gap:16px 28px}
.preview-controls{display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px;min-width:0}
.toolbar label{display:inline-flex;align-items:center;gap:6px}
.control-toggle{display:inline-flex}
.control-toggle button{padding-inline:12px;position:relative;white-space:nowrap}
.control-toggle button + button{margin-inline-start:-1px}
.control-toggle button[aria-pressed=true]{z-index:1;background:#242321;border-color:#242321;color:white;font-weight:600}
.control-toggle button:focus-visible{z-index:2}
.disclosure{display:inline-flex;align-items:center;gap:10px}
.disclosure::after{content:'';width:6px;height:6px;border:solid currentColor;border-width:0 1px 1px 0;transform:translateY(-2px) rotate(45deg)}
.disclosure[aria-expanded=true]{background:#eeebe5}
.disclosure[aria-expanded=true]::after{transform:translateY(2px) rotate(225deg)}
#preview-width{inline-size:86px;font:inherit;padding:6px 8px;border:1px solid #b6b0a7}
#preview-width:invalid{border-color:#9b3524}
.width-controls{display:flex;align-items:center;flex-wrap:wrap;gap:8px}
.width-adjustment{display:flex;align-items:center;gap:4px}
.width-adjustment .action-tip{width:44px}
.width-adjustment .action-tip:has(button[hidden]){visibility:hidden;pointer-events:none}
#preview-width-slider{width:clamp(64px,22vw,112px);height:44px;margin:0;accent-color:#395d75;cursor:ew-resize}
@media(max-width:350px){
  .width-controls,.width-adjustment{width:100%}
  #preview-width-slider{flex:1;min-width:0}
}
#auto-width[aria-pressed=true]{color:#395d75}
#width-feedback{color:#84301f;margin:4px 0 0}
#width-feedback:empty{display:none}
.logo-actions,.logo-file{display:flex;align-items:center;flex-wrap:wrap;gap:8px 14px}
.logo-panel button,.logo-panel select,.logo-panel input[type=number]{min-height:44px}
.logo-panel :is(a,button,summary,input,select):focus-visible{outline:2px solid #395d75;outline-offset:2px}
.logo-panel small{color:#504d47}
#logo-status{min-height:1.5em;margin:6px 0 0}
#logo-individual{border-top:1px solid #e7e2dc;margin-top:8px;padding-top:2px}
#logo-individual summary{cursor:pointer;min-height:44px;align-content:center;font-weight:600}
#logo-position-layout{display:grid;grid-template-columns:minmax(140px,170px) minmax(0,1fr);gap:12px;align-items:start;margin-top:4px}
#logo-positions{display:grid;gap:4px}
#logo-positions button{text-align:left;overflow-wrap:anywhere;border-color:transparent}
#logo-positions button:hover{background:#f6f5f2}
#logo-positions button[aria-pressed=true]{background:#eeebe5;border-color:#b6b0a7;font-weight:600}
@media(max-width:580px){#logo-position-layout{grid-template-columns:minmax(0,1fr)}#logo-positions{grid-template-columns:repeat(2,minmax(0,1fr))}}
#logo-options{border:1px solid #dedad3;background:#f9f8f6;padding:12px 16px;container-type:inline-size}
.logo-position-panel{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,260px) auto;align-items:center;gap:8px 16px}
.logo-visibility{justify-self:end}
.logo-size-fields{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:4px 8px}
.logo-size-fields label{display:grid;gap:4px}
.logo-size-fields input[type=number]{width:100%;min-width:0;font:inherit;padding:6px 10px;border:1px solid #b6b0a7}
.logo-size-fields input[type=range]{width:100%;height:32px;margin:0;accent-color:#395d75;cursor:ew-resize}
.logo-size-fields .action-tip [role=tooltip]{inset-inline-end:auto;inset-inline-start:50%;transform:translateX(-50%)}
@container(max-width:460px){
  .logo-position-panel{grid-template-columns:minmax(0,1fr) auto}
  .logo-size-fields{grid-area:2 / 1 / auto / -1}
  .logo-visibility{grid-area:1 / 2}
}
.logo-check{display:inline-flex;align-items:center;min-height:44px;gap:5px}
.logo-file-name{overflow-wrap:anywhere}
.logo-offsets{grid-column:1 / -1;border-top:1px solid #e7e2dc;padding-top:6px;margin-top:2px}
.logo-offsets summary{min-height:36px;align-content:center}
.offset-fields{display:flex;align-items:end;gap:8px 12px;flex-wrap:wrap}
.offset-fields label{display:grid;gap:4px}
.offset-fields input{width:82px;padding:6px 8px;font:inherit;border:1px solid #b6b0a7}
.nav-form{margin:0;padding:0;border:0;background:transparent;max-width:760px}
.nav-rows{display:grid;gap:6px}
.nav-item{display:flex;align-items:end;flex-wrap:wrap;gap:6px 10px}
.nav-item label{display:grid;gap:2px;min-width:0;flex:0 1 270px}
.nav-item label:has(input[id^=nav-anchor]){flex-basis:175px}
.nav-item input{min-width:0;min-height:44px;padding:6px 10px;border:1px solid #b6b0a7;font:inherit}
.nav-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
#navigation-status{margin:8px 0 0}
#navigation-status:empty{display:none}
@media(min-width:1040px){
  .nav-rows{grid-template-columns:repeat(2,minmax(0,1fr));column-gap:20px}
  .nav-item label:first-child{flex:1 1 140px}
  .nav-item:has(label + label){grid-column:1 / -1}
}
@media(max-width:500px){
  .nav-item{align-items:end;border-bottom:1px solid #e7e2dc;padding-bottom:6px}
  .nav-item label:first-child{flex:1 1 0}
  .nav-item:has(label + label) label{flex:1 1 100%;order:0}
  .nav-item:has(label + label) button{margin-inline-start:auto}
}
select{font:inherit;padding:6px;max-width:100%}
.display-settings{min-width:0;border-top:1px solid #e7e2dc;margin-top:10px;padding-top:10px}
.display-settings label{max-width:100%}
#slideshow-settings .logo-actions{gap:6px 10px}
#slideshow-settings .logo-actions > label{display:flex;align-items:center;flex-wrap:wrap;gap:5px}
#logo-preview-note{color:#504d47;margin-bottom:8px}
#slideshow-status{margin:8px 0 0}
#slideshow-images{margin-top:8px;padding:12px 16px;border:1px solid #dedad3;background:#f9f8f6}
#slide-photo{max-width:min(100%,360px)}
#slideshow-status:empty{margin:0}

table{border-collapse:collapse;width:100%;max-width:620px;font-variant-numeric:tabular-nums}td,th{text-align:left;border-bottom:1px solid #e7e2dc;padding:3px 5px}
details{margin-top:8px}#workspace[hidden]{display:none}
</style></head><body>
<header class="app-header">
<h1>單頁展示轉換工具</h1>
<div class="app-controls" role="group" aria-label="頁面操作">
<button id="import-toggle" class="header-action" type="button" aria-controls="import-panel" aria-expanded="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 19V6a1 1 0 0 1 1-1h5l2 2h7a1 1 0 0 1 1 1v3M3 19h15.5l3-8H6l-3 8Z"/></svg><span id="import-label">匯入</span></button>
<span class="action-tip">
<button id="logo-restore" class="header-action" type="button" aria-describedby="restore-tip" aria-disabled="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4v6h6M3.5 10a8.5 8.5 0 1 1 .9 7"/></svg>重置</button>
<span id="restore-tip" role="tooltip">重置為原始的解析畫面</span>
</span>
<span class="action-tip">
<a id="export" class="header-action" role="link" download aria-label="下載頁面 ZIP" aria-describedby="export-tip" aria-disabled="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M4 16v4h16v-4"/></svg>下載</a>
<span id="export-tip" role="tooltip">下載頁面 ZIP（包含目前調整）</span>
</span>
</div>
</header>
<main>
<section class="panel import-panel" id="import-panel" aria-labelledby="import-heading">
<h2 id="import-heading">匯入網頁</h2>
<form id="import">
<div class="import-inputs">
<fieldset class="import-modes" id="import-modes" aria-label="來源">
<div class="control-toggle">
<label><input type="radio" name="import-source" value="zip" checked>ZIP</label>
<label><input type="radio" name="import-source" value="html">HTML</label>
<label><input type="radio" name="import-source" value="folder">完整資料夾</label>
</div>
</fieldset>
<div class="import-sources">
<div class="import-source" data-import-mode="zip">
<small id="zip-help">選擇包含 HTML 和素材的 ZIP 檔。</small>
<label class="file-picker">選擇檔案
<input id="zip-entry" type="file" accept=".zip" aria-describedby="zip-help" aria-label="選擇 ZIP 檔">
</label>
<div class="file-choice" hidden>
<span></span>
<button type="button" data-clear-file="zip-entry" aria-label="清除 ZIP">清除</button>
</div>
</div>
<div class="import-source" data-import-mode="html" hidden>
<small id="entry-help">在 Chrome 選「網頁，完整」另存，再選擇 HTML 檔。</small>
<label class="file-picker">選擇檔案
<input id="entry" type="file" accept=".html,.htm" aria-describedby="entry-help" aria-label="選擇 HTML 檔">
</label>
<div class="file-choice" hidden>
<span></span>
<button type="button" data-clear-file="entry" aria-label="清除 HTML">清除</button>
</div>
</div>
<div class="import-source" data-import-mode="html" hidden>
<small id="materials-help">若 Chrome 另存時產生了素材資料夾，請一併選取。</small>
<label class="file-picker">選擇素材資料夾
<input id="materials" type="file" webkitdirectory multiple aria-describedby="materials-help" aria-label="選擇素材資料夾">
</label>
<div class="file-choice" hidden>
<span></span>
<button type="button" data-clear-file="materials" aria-label="清除搭配的素材資料夾">清除</button>
</div>
</div>
<div class="import-source" data-import-mode="folder" hidden>
<small id="folder-help">選擇同時包含 HTML 和素材的上層資料夾。</small>
<label class="file-picker">選擇資料夾
<input id="folder" type="file" webkitdirectory multiple aria-describedby="folder-help" aria-label="選擇完整網頁資料夾">
</label>
<div class="file-choice" hidden>
<span></span>
<button type="button" data-clear-file="folder" aria-label="清除網頁資料夾">清除</button>
</div>
</div>
</div>
</div>
<div class="import-review">
<div class="import-options">
<details class="import-archive">
<summary>缺圖時加入 Chrome 封存（選填）<small id="archive-selection"></small></summary>
<div class="import-source">
<small id="archive-help">選擇同一頁以「單一檔案」另存的 .mhtml 或 .mht，補回封存中有收錄的圖片。</small>
<label class="file-picker">選擇檔案
<input id="browser-archive" type="file" accept=".mhtml,.mht" aria-describedby="archive-help" aria-label="選擇 Chrome 網頁封存">
</label>
<div class="file-choice" hidden>
<span></span>
<button type="button" data-clear-file="browser-archive" aria-label="清除 Chrome 網頁封存">清除</button>
</div>
</div>
</details>
<label><input id="fetch-images" type="checkbox" checked> 自動下載缺少的 HTTPS 圖片與字型</label>
</div>
<div class="import-actions">
<button id="parse-page" class="primary parse-button" type="submit" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V10Zm0 0v7h7M9 12l-2 2 2 2m6-4 2 2-2 2m-2-5-2 6"/></svg>解析網頁</button>
</div>
<p id="status" role="status"></p>
</div>
</form>
<div class="import-progress" id="import-progress-area" hidden>
<p class="import-progress-label"><span id="import-phase" role="status"></span><span id="import-percentage" aria-hidden="true"></span></p>
<progress id="import-progress" max="100" value="0" aria-label="網頁解析進度" aria-describedby="import-phase"></progress>
</div>
</section>
<section id="workspace" hidden>
<div class="workspace-controls">
<div class="panel" id="rwd-panel"><div class="display-header"><h2>RWD 檢查結果</h2></div><p id="summary"></p><p id="carousel-status" hidden></p>
<details><summary>查看各寬度與缺少的素材</summary><table><thead><tr><th>寬度</th><th>修正前溢出</th><th>修正後溢出</th></tr></thead><tbody id="measurements"></tbody></table><p id="missing"></p><ul id="image-downloads"></ul></details>
</div>
<section class="panel logo-panel" aria-labelledby="display-heading">
<div class="display-header">
<h2 id="display-heading">展示與調整</h2>
</div>
<div class="toolbar">
<div class="preview-controls">
<div id="preview-device" class="control-toggle" role="group" aria-label="預覽裝置">
<button type="button" value="mobile" aria-pressed="true">手機</button>
<button type="button" value="tablet" aria-pressed="false">平板</button>
<button type="button" value="desktop" aria-pressed="false">桌機</button>
</div>
<div class="width-controls">
<label>預覽寬度 <input id="preview-width" type="number" min="240" max="4096" step="1" required value="390"> <span>px</span></label>
<div class="width-adjustment">
<input id="preview-width-slider" type="range" min="240" max="4096" step="1" value="390" aria-label="預覽寬度滑桿" aria-valuetext="390 px">
<span class="action-tip">

  const canvas = document.createElement('canvas');
  canvas.width = Math.max(1,Math.round(image.naturalWidth*scale));
  canvas.height = Math.max(1,Math.round(image.naturalHeight*scale));
  const ctx = canvas.getContext('2d',{willReadFrequently:true});

      right = Math.max(right,x);

  const exportLink = $('export');

    }

    if (navEdited() && !await saveNavigation()) return;
    await flushSizes();
    if (current?.id === project) window.location.assign(exportLink.href);
  };
  function describePosition() {
    const nearest = nearestMeasuredWidth();

      : !selected ? '這個寬度沒有可調整的 Logo。'
      : selected.hasVariants && !metrics(selected)?.visible
        ? '正在預覽「'+selected.label+'」。匯出後會依原網頁狀態切換。'
        : '只列出適用於 '+selectedWidth+' px 的 Logo 位置。';
  }

  function syncPositions() {

      button.setAttribute('aria-pressed',String(logo === selected));
      button.onclick = () => {

  function setEffect(value) {

    easing.value = value.easing;
  }
  slideshowToggle.hidden = !report.slideshowCount;
  slideshowStatus.textContent = '';
  for (const option of transition.querySelectorAll('option:is([value=depth],[value=reveal])')) {

  }
  setEffect(savedEffect);
  const applyEffect = () => {
    flushSizes();
    const value = {transition:transition.value,easing:easing.value};
    updateLogo(() => post('/slideshow/'+project,value),'正在更新轉場…',() => {

  setDisclosure(photoToggle,false);

    const title = image.title ? ' · '+image.title : '';
    const position = image.imageCount > 1 ? ' · 圖片 '+(image.imageIndex+1) : '';
    return new Option(gallery+'第 '+(image.slide+1)+' 張'+title+position,image.id);

  photoFile.value = '';

const importForm = $('import');
const parseButton = $('parse-page');
const importModes = $('import-modes');
const importModeFields = [...importForm.querySelectorAll('[data-import-mode]')];
const importSources = [...importForm.querySelectorAll('[data-clear-file]')].map(clear => ({
  clear, input: $(clear.dataset.clearFile), selection: clear.parentElement
}));
let parsingPage = false;
function setImportProgress(percent,label) {
  $('import-progress').value = percent;
  $('import-percentage').textContent = percent+'%';
  const phase = $('import-phase');
  if (phase.textContent !== label) phase.textContent = label;
}
async function importPage(data) {
  const response = await fetch('/import',{method:'POST',
    headers:{'Content-Type':'application/json',Accept:'application/x-ndjson'},body:JSON.stringify(data)});
  if (!response.ok) {
    const result = await response.json();
    throw Error(result.error || '解析網頁失敗。');
  }
  let buffered = '';
  for await (const chunk of response.body.pipeThrough(new TextDecoderStream())) {
    buffered += chunk;
    const lines = buffered.split('\n');
    buffered = lines.pop();
    for (const line of lines) {
      const message = JSON.parse(line);
      if (message.error) throw Error(message.error);
      if (message.result) return message.result;
      setImportProgress(message.percent,message.label);
    }
  }
  throw Error('解析進度中斷，請重新解析。');
}
function selectedImport() {
  const mode = importModes.querySelector(':checked').value;
  const entry = mode === 'zip' ? $('zip-entry').files[0] : mode === 'html' ? $('entry').files[0] : undefined;
  const folder = mode === 'zip' ? [] : [...$(mode === 'html' ? 'materials' : 'folder').files];
  const browserArchive = $('browser-archive').files[0];
  const hasPage = mode === 'folder' ? folder.some(file => /\.html?$/i.test(file.name)) :
    (mode === 'zip' ? /\.zip$/i : /\.html?$/i).test(entry?.name ?? '');
  return {mode,entry,folder,browserArchive,hasPage};
}
function refreshImportControls() {
  const {mode,browserArchive,hasPage} = selectedImport();
  for (const group of importModeFields) group.hidden = group.dataset.importMode !== mode;
  $('archive-selection').textContent = browserArchive?.name ?? '';
  parseButton.disabled = parsingPage || !hasPage;
  importModes.disabled = parsingPage;
  $('fetch-images').disabled = parsingPage;
  importToggle.setAttribute('aria-disabled',String(parsingPage));
  importForm.setAttribute('aria-busy',String(parsingPage));
  for (const {clear,input,selection} of importSources) {
    const file = input.files[0];
    selection.hidden = !file;
    selection.firstElementChild.textContent = file ? file.webkitRelativePath.split('/')[0] || file.name : '';
    clear.disabled = input.disabled = parsingPage;
  }
}
function resetImportForm() {
  importForm.reset();
  importForm.querySelector('.import-archive').open = false;
  status.textContent = '';
  refreshImportControls();
}
importToggle.onclick = () => {
  if (parsingPage) return;
  if (importPanel.hidden) resetImportForm();
  showImportPanel(importPanel.hidden);
};
importModes.addEventListener('change',refreshImportControls);
for (const {clear,input} of importSources) {
  input.addEventListener('change',refreshImportControls);
  clear.onclick = () => {
    input.value = '';
    refreshImportControls();
    input.focus({preventScroll:true});
  };
}
window.addEventListener('pageshow',refreshImportControls);
refreshImportControls();
importForm.onsubmit = async event => {
  event.preventDefault();
  if (parseButton.disabled) return;
  const {entry,folder,browserArchive} = selectedImport();
  const fetchMedia = $('fetch-images').checked;
  parsingPage = true;
  refreshImportControls();
  current = null;
  $('workspace').hidden = true;
  $('page').removeAttribute('src');
  $('logo-restore').setAttribute('aria-disabled','true');
  $('export').setAttribute('aria-disabled','true');
  $('export').removeAttribute('href');
  status.textContent = '';
  $('import-progress-area').hidden = false;
  setImportProgress(0,'讀取本機檔案');
  try {
    const files = [...(entry ? [entry] : []),...folder];
    if (files.reduce((total,file) => total+file.size,browserArchive?.size || 0) > 80*1024*1024) throw Error('匯入上限為 80 MB。');
    const items = [];
    const total = files.length + Number(Boolean(browserArchive));
    for (const file of files) {
      let path = file.webkitRelativePath || file.name;
      if (!entry && file.webkitRelativePath) path = path.slice(path.indexOf('/')+1);
      items.push({path,data:(await readFile(file)).split(',')[1]});
      setImportProgress(Math.floor(10*items.length/total),'讀取本機檔案');
    }
    const archiveData = browserArchive ? (await readFile(browserArchive)).split(',')[1] : undefined;
    setImportProgress(10,'送出檔案供解析');
    current = await importPage({items,fetchImages:fetchMedia,fetchFonts:fetchMedia,browserArchive:archiveData});
    setImportProgress(100,'解析完成');
    $('import-label').textContent = '重新匯入';
    if (importPanel.contains(document.activeElement)) importToggle.focus({preventScroll:true});
    showImportPanel(false);
    display(current);
    status.textContent = '已匯入 '+current.entry;
  } catch(error) {
    showImportPanel(true);
    status.textContent = error.message;
  }
  finally {
    parsingPage = false;
    $('import-progress-area').hidden = true;
    refreshImportControls();
  }
};
